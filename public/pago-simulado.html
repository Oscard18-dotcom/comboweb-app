<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pago · EN COMBO</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#3F210E">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><a class="marca" href="/"><img src="logo-96.png" alt="" width="44" height="44">EN COMBO</a></header>
  <main>
    <section class="card narrow">
      <h2>Pago con tarjeta</h2>
      <p id="total" class="tot"></p>
      <form id="form" novalidate autocomplete="off" aria-label="Datos de la tarjeta">
        <label>Nombre del titular
          <input id="titular" name="cc-name" type="text" autocomplete="cc-name" maxlength="60" placeholder="Como aparece en la tarjeta" required>
          <small class="fe" id="e-titular" role="alert"></small></label>
        <label>Número de tarjeta
          <input id="numero" name="cc-number" type="text" inputmode="numeric" autocomplete="cc-number" maxlength="23" placeholder="0000 0000 0000 0000" required>
          <small class="fe" id="e-numero" role="alert"></small></label>
        <div class="row">
          <label style="flex:1">Vencimiento
            <input id="vence" name="cc-exp" type="text" inputmode="numeric" autocomplete="cc-exp" maxlength="7" placeholder="MM/AA" required>
            <small class="fe" id="e-vence" role="alert"></small></label>
          <label style="flex:1">Código (CVV)
            <input id="cvv" name="cc-csc" type="password" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="123" required>
            <small class="fe" id="e-cvv" role="alert"></small></label>
        </div>
        <p id="err" class="err" role="alert"></p>
        <div class="row">
          <button id="aprobar" class="btn" type="submit" disabled>Pagar</button>
          <button id="rechazar" class="btn s" type="button" disabled>Cancelar pago</button>
        </div>
      </form>
    </section>
  </main>
  <script src="pago-simulado.js"></script>
</body>
</html>
